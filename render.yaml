services:
  - type: web
    name: pyoj
    runtime: python
    plan: free
    region: singapore          # 新加坡节点，国内访问相对快
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python run.py"
    healthCheckPath: "/"
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: "3.11"
